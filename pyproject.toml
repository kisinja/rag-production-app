[project]
name = "rag-production-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kisinja", email = "kisinjaelvis@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.3",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "openai>=3.26.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-production-app = "rag_production_app:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
